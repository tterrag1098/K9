name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    # Step 6: Upload build artifacts (JAR files) to the GitHub Actions run
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: java-build-artifacts
        # Adjust this path if your build creates artifacts elsewhere (e.g., custom multi-project layout)
        path: build/libs/*.jar
